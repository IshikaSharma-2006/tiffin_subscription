<div class="form-page">

  <div class="form-card">

    <a routerLink="/owner/dashboard" class="back-link">
      ← Back to Dashboard
    </a>

    <div class="brand">
      <span>🍱</span>
      <div>
        <h1>Subscribe Customer</h1>
        <p>Add a new monthly tiffin subscriber</p>
      </div>
    </div>

    <form (ngSubmit)="saveCustomer()">

      <div class="form-group">
        <label for="name">Customer Name</label>

        <input
          id="name"
          type="text"
          name="name"
          [(ngModel)]="name"
          placeholder="Rahul Sharma"
          required
        />
      </div>


      <div class="form-group">
        <label for="phone">Phone Number</label>

        <input
          id="phone"
          type="tel"
          name="phone"
          [(ngModel)]="phone"
          placeholder="9876543210"
          maxlength="10"
          required
        />
      </div>


      <div class="form-group">
        <label for="price">Monthly Plan Price</label>

        <div class="price-input">
          <span>₹</span>

          <input
            id="price"
            type="number"
            name="monthlyPlanPrice"
            [(ngModel)]="monthlyPlanPrice"
            placeholder="3000"
            min="1"
            required
          />
        </div>
      </div>


      <div class="form-group">
        <label for="startDate">
          Subscription Start Date
        </label>

        <input
          id="startDate"
          type="date"
          name="subscriptionStartDate"
          [(ngModel)]="subscriptionStartDate"
          required
        />
      </div>


      @if (successMessage) {
        <div class="success">
          {{ successMessage }}
        </div>
      }


      @if (errorMessage) {
        <div class="error">
          {{ errorMessage }}
        </div>
      }


      <button
        type="submit"
        [disabled]="loading"
      >
        {{ loading ? 'Subscribing...' : 'Subscribe Customer' }}
      </button>

    </form>

  </div>

</div>
